<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Student Task Manager</h1>
    <p class="subtitle">Plan your work. Complete your goals.</p>

    <form id="taskForm">
      <input
        id="taskInput"
        type="text"
        placeholder="Enter a new task..."
        required
      />
      <input id="dateInput" type="date" />
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="completed">Completed</button>
      <button class="filter" data-filter="history">History</button>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyMessage">No tasks yet. Add your first task!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
